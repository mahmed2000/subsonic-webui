<!DOCTYPE html>
<html>

<head>
  <title>Subsonic Webui</title>
  <script>
    class Browser {
      constructor(player) {
        this.nav_chain = [];
        this.player = player;
      }

      // fetch children of current end of nav_chain,
      // insert said children into the <ul> list
      async repopulate() {
        if (this.nav_chain.length === 0) {
          var target = "%00"; // magic NULL byte to tell backend this is root dir
        } else {
          var target = this.nav_chain[this.nav_chain.length - 1];
        }
        let entries_resp = await fetch(`/api/list/${target}`);
        if (entries_resp.status !== 200) { // shouldn't be possible, but handle it anyway
          return
        }

        let entries = await entries_resp.json();
        // if not at root dir, insert a fake entry that targets the previous entry in the nav_chain (or NULL if would go to root)
        if (this.nav_chain.length > 0) {
          entries.unshift({
            id: this.nav_chain.length > 1 ? this.nav_chain[this.nav_chain.length - 2] : "%00",
            isDir: true,
            name: "[..]"
          });
        }
        let dir_items = [];
        for (let entry of entries) {
          let node = document.createElement("li");
          let node_button = document.createElement("button");
          node_button.type = "button";
          if (entry.isDir) {
            node.classList.add("dir");
            node_button.addEventListener("click", () => {
              if (entry.name == "[..]") { // back navigation must pop instead of push
                this.nav_chain.pop();
              } else {
                this.nav_chain.push(entry.id);
              }
              this.repopulate();
            });
          } else {
            node.classList.add("song");
            node_button.addEventListener("click", () => {
              this.player.play(entry.name, entry.album, entry.coverId, entry.id);
            });
          }
          node_button.innerText = entry.name;
          node.insertAdjacentElement("afterbegin", node_button);
          dir_items.push(node);
        }
        document.querySelector("ul#curr-dir").replaceChildren(...dir_items);
      }
    }

    class Player {
      constructor() {
        let aside = document.querySelector("aside");
        this.title = aside.querySelector("h2");
        this.album = aside.querySelector("h5");
        this.cover = aside.querySelector("img");
        this.audio = aside.querySelector("audio");
      }

      play(title, album, cover_id, song_id) {
        this.title.innerText = title;
        this.album.innerText = album ? album : "";
        this.cover.src = cover_id ? `/api/cover/${cover_id}` : "about:blank"; // if no cover ids, default back to about:blank
        this.audio.src = `/api/stream/${song_id}`;
        this.audio.play();

        if (navigator.mediaSession) {
          let metadata = new MediaMetadata({
            album: album,
            title: title,
          });
          if (cover_id !== undefined) {
            metadata.artwork = [{src: `/api/cover/${cover_id}`}];
          }
          navigator.mediaSession.metadata = metadata;
        }
      }
    }

    document.addEventListener("DOMContentLoaded", async () => {
      let player = new Player();
      let browser = new Browser(player);
      browser.repopulate();

      document.querySelector("button#dir-reset").addEventListener("click", () => {
        browser.nav_chain = [];
        browser.repopulate();
      })
    });
  </script>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --flex-dir: row;
      --flex-main: 6;
      --flex-aside: 4;
      --audio-zoom: 1;
    }

    @media (orientation: portrait) {
      dialog form * {
        font-size: 2vh;
      }

      :root {
        --flex-dir: column;
        --flex-main: 9;
        --flex-aside: 1;
        --audio-zoom: 3;
      }
    }

    body {
      font-size: clamp(3vh, 2em, 4vh);
      margin: 0;
      padding: 0.5rem;
      font-family: system-ui;
      height: 100dvh;
      width: 100dvw;
      display: flex;
      flex-direction: var(--flex-dir);
    }

    main {
      flex: var(--flex-main);
      overflow: scroll;

      &>button::before {
        content: '\2302  ';
      }

      button {
        font-size: inherit;
        padding: 1em;
        width: 100%;
        text-align: left;
      }

      li.dir {
        button::before {
          content: '\1F4C1  ';
        }
      }

      li.song {
        button::before {
          content: '\25B6  ';
        }
      }

      li {
        list-style: none;
      }

      ul {
        padding-left: 0;
      }
    }

    aside {
      flex: var(--flex-aside);

      audio {
        width: 100%;
        zoom: var(--audio-zoom);
      }

      img {
        height: max(15vw, 200px);
      }


      &>div {
        display: flex;

        &>div {
          display: inline-block;
        }
      }
    }

    h2,
    h5 {
      margin-top: 0;
      margin-bottom: 0;
    }
  </style>
</head>

<body>
  <!-- Main holds directory nav. Button to return to root for convenience. Will follow the same conventions as github/forgejo having ".." to go up one dir. -->
  <main>
    <button id="dir-reset" type="submit">Root</button>
    <hr />
    <ul id="curr-dir">
    </ul>
  </main>

  <!-- Aside holds metadata about the playing song and the actual audio element. Side drawer on landscape, bottom drawer on portrait -->
  <aside>
    <div>
      <img src="about:blank" id="aside-cover" />
      <div>
        <h2 id="aside-title"></h2>
        <h5 id="aside-album"></h5>
      </div>
    </div>
    <audio controls src="about:blank" id="aside-audio"></audio>
  </aside>
</body>

</html>
