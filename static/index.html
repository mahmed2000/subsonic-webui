<!DOCTYPE html>
<html>

<head>
  <title>Subsonic Webui</title>
  <script>
    class UnauthError extends Error {
      constructor(...args) {
        super(...args);
        this.name = "UnauthError";
      }
    }

    document.addEventListener("DOMContentLoaded", async () => {
      const dialog = document.querySelector("dialog");
      dialog.addEventListener("cancel", (ev) => {
        ev.preventDefault();
      });

      document.addEventListener("reauth", () => {
        console.log("reauth");
        dialog.showModal();
      });

      class Browser {
        constructor() {
          this.nav_chain = [];
        }

        async repopulate() {
          let token = sessionStorage.getItem("token");
          if (token === null) {
            console.debug("Browser.repopulate() called without posession of token!");
          }
          if (this.nav_chain.length === 0) {
            var target = "%00"; // magic NULL byte to tell backend this is root dir
          } else {
            var target = this.nav_chain[this.nav_chain.length - 1];
          }
          let entries_resp = await fetch(`/api/list/${target}`, {
            headers: {
              Authorization: `Bearer ${token}`
            }
          });
          if (entries_resp.status === 401) {
            throw new UnauthError("Token invalid");
          } else if (entries_resp.status !== 200) {
            return
          }

          let entries = await entries_resp.json();
          if (this.nav_chain.length > 0) {
            entries.unshift({
              id: this.nav_chain.length > 1 ? this.nav_chain[this.nav_chain.length - 2] : "%00",
              isDir: true,
              name: "[..]"
            });
          }
          let dir_items = [];
          for (let entry of entries) {
            let node = document.createElement("li");
            let node_button = document.createElement("button");
            node_button.type = "button";
            if (entry.isDir) {
              node.classList.add("dir");
              node_button.addEventListener("click", async () => {
                if (entry.name == "[..]") {
                  this.nav_chain.pop();
                } else {
                  this.nav_chain.push(entry.id);
                }
                try {
                  await this.repopulate();
                } catch (err) {
                  if (err instanceof UnauthError) {
                    document.dispatchEvent(new Event("reauth"));
                  }
                }
              });
            } else {
              node.classList.add("song");
            }
            node_button.innerText = entry.name;
            node.insertAdjacentElement("afterbegin", node_button);
            dir_items.push(node);
          }
          document.querySelector("ul#curr-dir").replaceChildren(...dir_items);
        }
      }

      const login_form = dialog.querySelector("form");

      let browser = new Browser();

      login_form.addEventListener("submit", async (ev) => {
        let creds = new FormData(ev.target);
        try {
          let resp = await fetch("/api/login", {
            method: "POST",
            body: JSON.stringify({
              server: creds.get("server"),
              username: creds.get("name"),
              password: creds.get("password"),
            })
          });
          if (resp.status !== 200) {
            throw new UnauthError("Token Invalid");
          } else {
            let resp_reader = resp.body.getReader();
            let token = "";
            while (true) {
              let chunk = await resp_reader.read();
              if (chunk.done) {
                break
              }
              token += String.fromCharCode(...chunk.value);
            }
            sessionStorage.setItem("token", token);
            browser.repopulate();
          }
        } catch (err) {
          console.error(err);
          document.dispatchEvent(new Event("reauth"));
        }
      })

      if (sessionStorage.getItem("token") === null) {
        dialog.showModal();
      } else {
        try {
          await browser.repopulate();
        } catch (err) {
          if (err instanceof UnauthError) {
            document.dispatchEvent(new Event("reauth"));
          }
        }
      }

    });
  </script>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --flex-dir: row;
      --flex-main: 6;
      --flex-aside: 4;
      --audio-zoom: 1;
    }

    @media (orientation: portrait) {
      dialog form * {
        font-size: 2vh;
      }

      :root {
        --flex-dir: column;
        --flex-main: 9;
        --flex-aside: 1;
        --audio-zoom: 3;
      }
    }

    body {
      font-size: clamp(2vh, 2em, 4vh);
      margin: 0;
      padding: 0.5rem;
      font-family: system-ui;
      height: 100dvh;
      width: 100dvw;
      display: flex;
      flex-direction: var(--flex-dir);
    }

    main {
      flex: var(--flex-main);
      overflow: scroll;

      &>button::before {
        content: '\2302  ';
      }

      button {
        font-size: inherit;
        padding: 1em;
        width: 100%;
        text-align: left;
      }

      li.dir {
        button::before {
          content: '\1F4C1  ';
        }
      }

      li.song {
        button::before {
          content: '\25B6  ';
        }
      }

      li {
        list-style: none;
      }

      ul {
        padding-left: 0;
      }
    }

    aside {
      flex: var(--flex-aside);

      audio {
        width: 100%;
        zoom: var(--audio-zoom);
      }

      img {
        height: max(15vw, 200px);
      }

      &>div {
        margin-left: 1em;
        display: inline-block;
      }
    }

    dialog:modal {
      h1 {
        text-align: center;
      }

      p#error {
        color: red;
      }

      form {
        &>div {
          display: flex;
          flex-wrap: wrap;
          justify-content: space-around;

          label {
            width: 30%;
          }

          input {
            width: 60%;
          }

          button {
            width: 70%;
          }
        }
      }

    }
  </style>
</head>

<body>
  <!-- Dialog shown on load. Credentials API isn't standard yet across browsers, what can you do -->
  <dialog>
    <h1>Subsonic Login</h1>
    <form id="auth" method="dialog">
      <div>
        <label for="auth-server">Server: </label>
        <input id="auth-server" name="server" type="url" placeholder="https://demo.navidrome.org" required />

        <label for="auth-name">Username: </label>
        <input id="auth-name" name="name" type="text" placeholder="demo" required />

        <label for="auth-pass">Password: </label>
        <input id="auth-pass" name="password" type="password" placeholder="demo" required />

        <button type="submit">Login</button>
      </div>
    </form>
  </dialog>

  <!-- Main holds directory nav. Button to return to root for convenience. Will follow the same conventions as github/forgejo having ".." to go up one dir. -->
  <main>
    <button id="dir-reset" type="submit">Root</button>
    <hr />
    <ul id="curr-dir">
    </ul>
  </main>

  <!-- Aside holds metadata about the playing song and the actual audio element. Side drawer on landscape, bottom drawer on portrait -->
  <aside>
    <div>
      <img src="about:blank" id="aside-cover" />
      <div style="display: inline-block;">
        <h2 id="aside-title"></h2>
        <h4 id="aside-album"></h4>
      </div>
    </div>
    <audio controls src="about:blank" id="aside-audio"></audio>
  </aside>
</body>

</html>
